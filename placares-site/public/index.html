<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placares ao vivo</title>
<meta name="robots" content="noindex">
<style>
  /* Dois placares, cada um na sua página. Esta página só leva a um deles. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: system-ui, sans-serif; color: #FFF4EC; }
  main { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
  a { display: grid; place-items: center; text-decoration: none; color: inherit; font-weight: 900; font-size: clamp(2.4rem, 9vw, 7rem); letter-spacing: -.02em; }
  a.quiz { background: #A81F4C; } a.missao { background: #07566F; }
  a:hover, a:focus-visible { filter: brightness(1.15); outline: none; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<main>
  <a class="quiz" href="/quiz">Quiz</a>
  <a class="missao" href="/missao">Missão</a>
</main>
</body>
</html>
